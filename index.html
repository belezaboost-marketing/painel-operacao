<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Operação</title>
<style>
  :root{
    --bg:#0B0F14; --surface:#121821; --surface-2:#1A222D; --border:#232D3A;
    --text:#E9EEF3; --muted:#8C9BAB; --muted-2:#5E6C7A;
    --accent:#F0577A; --accent-soft:rgba(240,87,122,.14);
    --good:#34D399; --good-soft:rgba(52,211,153,.12);
    --warn:#F5B942; --warn-soft:rgba(245,185,66,.12);
    --bad:#F2665B; --bad-soft:rgba(242,102,91,.14);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F3F1; --surface:#FFFFFF; --surface-2:#FBF7F6; --border:#E7E1DD;
      --text:#1B1712; --muted:#6B6157; --muted-2:#948A80;
      --accent:#D93F63; --accent-soft:rgba(217,63,99,.08);
      --good:#1C9A6C; --good-soft:rgba(28,154,108,.1);
      --warn:#B8791A; --warn-soft:rgba(184,121,26,.1);
      --bad:#C6392F; --bad-soft:rgba(198,57,47,.1);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F3F1; --surface:#FFFFFF; --surface-2:#FBF7F6; --border:#E7E1DD;
    --text:#1B1712; --muted:#6B6157; --muted-2:#948A80;
    --accent:#D93F63; --accent-soft:rgba(217,63,99,.08);
    --good:#1C9A6C; --good-soft:rgba(28,154,108,.1);
    --warn:#B8791A; --warn-soft:rgba(184,121,26,.1);
    --bad:#C6392F; --bad-soft:rgba(198,57,47,.1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:40px;height:40px;object-fit:contain;flex:none}
  .brand h1{font-family:'Sora',sans-serif;font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .live{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px 7px 10px;font-size:12.5px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);position:relative;flex:none}
  .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--good);
    animation:pulse 2.2s ease-out infinite}
  .dot.warn,.dot.warn::after{background:var(--warn);border-color:var(--warn)}
  .dot.bad,.dot.bad::after{background:var(--bad);border-color:var(--bad);animation:none}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  .live b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .banner{display:none;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
    border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .banner.show{display:block}
  .banner.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;
    cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;font:inherit;color:inherit}
  .tile:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tile .n{font-family:'Sora',sans-serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1;margin-bottom:6px}
  .tile.ok .n{color:var(--good)} .tile.mid .n{color:var(--warn)} .tile.hi .n{color:var(--bad)}
  .tile .lbl{font-size:12.5px;color:var(--muted);line-height:1.4}
  .tile .stripe{height:3px;border-radius:3px;margin-bottom:14px;background:var(--border)}
  .tile.ok .stripe{background:var(--good)} .tile.mid .stripe{background:var(--warn)} .tile.hi .stripe{background:var(--bad)}
  .tile .chev{float:right;color:var(--muted-2);font-size:12px;transform:translateY(2px)}
  .detail{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;
    margin:6px 0 20px;display:none;overflow:hidden}
  .detail.show{display:block}
  .detail .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;
    border-bottom:1px solid var(--border);font-size:13.5px}
  .detail .row:last-child{border-bottom:none}
  .detail .row a{color:var(--text);text-decoration:none;font-weight:500}
  .detail .row a:hover{color:var(--accent)}
  .detail .row span{color:var(--muted-2);font-size:12px;flex:none}
  .detail .empty{padding:16px 14px;color:var(--muted);font-size:13px}
  .foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted-2);font-size:11.5px;
    margin-top:28px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px}
  .foot code{background:var(--surface);padding:2px 6px;border-radius:5px;font-size:11px}
  .skel{opacity:.35}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50}
  .gate.hide{display:none}
  .gate-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 28px;
    max-width:360px;width:100%;text-align:center}
  .gate-card img{width:44px;height:44px;object-fit:contain;margin-bottom:14px}
  .gate-card h2{font-family:'Sora',sans-serif;font-size:17px;margin:0 0 6px}
  .gate-card p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 20px}
  .gate-card input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:11px 13px;color:var(--text);font-size:14px;font-family:inherit;margin-bottom:10px}
  .gate-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .gate-card button{width:100%;background:var(--accent);border:none;border-radius:10px;padding:11px;
    color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .gate-card button:disabled{opacity:.6;cursor:default}
  .gate-msg{font-size:12.5px;color:var(--muted);margin-top:14px;min-height:16px}
  .gate-msg.err{color:var(--bad)}
  .gate-msg.ok{color:var(--good)}
  .signout{background:none;border:none;color:var(--muted-2);font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
</style>
</head>

  function setSession(s){ try { localStorage.setItem('bb_painel_sessao', JSON.stringify(s)); } catch(e){} }
  function clearSession(){ try { localStorage.removeItem('bb_painel_sessao'); } catch(e){} }

  function showGate(msg, cls){
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').classList.remove('hide');
    var m = document.getElementById('gateMsg');
    m.textContent = msg || '';
    m.className = 'gate-msg' + (cls ? ' ' + cls : '');
  }
  function showApp(){
    document.getElementById('gate').classList.add('hide');
    document.getElementById('app').style.display = '';
    var sess = getSession();
    var so = document.getElementById('signout');
    if (sess && sess.email){ so.style.display = ''; so.textContent = 'sair (' + sess.email + ')'; }
  }

  function pedirLink(email){
    var btn = document.getElementById('gateBtn');
    btn.disabled = true;
    fetch(AUTH_BASE + '/otp', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, create_user: false })
    }).then(function(r){
      btn.disabled = false;
      if (r.ok) {
        showGate('Link enviado para ' + email + ' — confira seu e-mail (pode levar 1-2 min).', 'ok');
        return;
      }
      return r.json().then(function(body){
        var code = body && body.error_code;
        if (code === 'over_email_send_rate_limit') {
          showGate('Muitos pedidos de link em pouco tempo — o serviço de e-mail pausou por alguns minutos. Espere um pouco e tente de novo.', 'err');
        } else {
          showGate('Não consegui enviar o link agora (' + (body && body.msg ? body.msg : 'erro desconhecido') + ').', 'err');
        }
      });
    }).catch(function(){
      btn.disabled = false;
      showGate('Não consegui enviar o link agora — falha de conexão. Tente de novo em instantes.', 'err');
    });
  }

  function tentarSessaoDaURL(){
    var hash = window.location.hash || '';
    if (hash.indexOf('access_token=') === -1) return false;
    var params = new URLSearchParams(hash.substring(1));
    var access_token = params.get('access_token');
    var refresh_token = params.get('refresh_token');
    if (!access_token) return false;
    var email = null;
    try {
      var payload = JSON.parse(atob(access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      email = payload.email || null;
    } catch(e) {}
    setSession({ access_token: access_token, refresh_token: refresh_token, email: email });
    history.replaceState(null, '', window.location.pathname + window.location.search);
    return true;
  }

  function renovarSessao(sess){
    if (!sess || !sess.refresh_token) return Promise.resolve(null);
    return fetch(AUTH_BASE + '/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    }).then(function(r){ if (!r.ok) throw new Error('refresh falhou'); return r.json(); })
      .then(function(d){
        var novo = { access_token: d.access_token, refresh_token: d.refresh_token, email: sess.email };
        setSession(novo);
        return novo;
      }).catch(function(){ clearSession(); return null; });
  }

  var CATS = [
    { key: 'backup_no_drive', titulo: 'Backup no Drive', sub: 'reunião parada há mais de 1h nessa etapa', exKey: 'backup_no_drive' },
    { key: 'aguardando_onboarding_sem_dono', titulo: 'Onboarding sem dono', sub: 'cliente aguardando onboarding, sem responsável', exKey: 'aguardando_onboarding_sem_dono' },
    { key: 'copy_esquecido_7d', titulo: 'Copy esquecido', sub: 'vídeo parado em "base" há mais de 7 dias', exKey: 'copy_esquecido_7d' },
    { key: 'design_esquecido_7d', titulo: 'Design esquecido', sub: 'arte parada em "base" há mais de 7 dias', exKey: 'design_esquecido_7d' }
  ];

  var openKey = null;
  var lastGood = null;
  try { var cached = localStorage.getItem('bb_painel_vivo_cache'); if (cached) lastGood = JSON.parse(cached); } catch(e) {}

  function sev(n){ if (n === 0) return 'ok'; if (n <= 4) return 'mid'; return 'hi'; }

  function render(dados, atualizadoEm, offline){
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var travados = (dados && dados.travados) || {};
    var exemplos = (dados && dados.exemplos) || {};

    CATS.forEach(function(cat){
      var n = travados[cat.key];
      var known = typeof n === 'number';
      var s = known ? sev(n) : 'mid';
      var tile = document.createElement('button');
      tile.className = 'tile ' + s + (known ? '' : ' skel');
      tile.innerHTML =
        '<div class="stripe"></div>' +
        '<div class="n">' + (known ? n : '—') + '<span class="chev">' + (openKey === cat.key ? '▾' : '▸') + '</span></div>' +
        '<div class="lbl"><strong style="color:var(--text)">' + cat.titulo + '</strong><br>' + cat.sub + '</div>';
      tile.onclick = function(){ openKey = (openKey === cat.key) ? null : cat.key; render(dados, atualizadoEm, offline); };
      grid.appendChild(tile);
    });

    var det = document.getElementById('detalhes');
    det.innerHTML = '';
    if (openKey){
      var cat = CATS.filter(function(c){ return c.key === openKey; })[0];
      var lista = exemplos[cat.exKey] || [];
      var box = document.createElement('div');
      box.className = 'detail show';
      if (!lista.length){
        box.innerHTML = '<div class="empty">Nenhum caso encontrado nessa categoria agora — bom sinal.</div>';
      } else {
        box.innerHTML = lista.map(function(item){
          return '<div class="row"><a href="' + item.url + '" target="_blank" rel="noopener">' + item.nome + '</a><span>abrir no ClickUp ↗</span></div>';
        }).join('');
      }
      det.appendChild(box);
    }

    var dot = document.getElementById('dot');
    var banner = document.getElementById('banner');
    var idadeEl = document.getElementById('idade');
    dot.className = 'dot';
    banner.className = 'banner';

    if (offline){
      dot.className = 'dot bad';
      idadeEl.textContent = 'sem conexão agora';
      banner.className = 'banner bad show';
      banner.textContent = 'Não consegui buscar dados novos agora. Mostrando a última leitura salva neste navegador.';
      return;
    }

    var ms = atualizadoEm ? (Date.now() - new Date(atualizadoEm).getTime()) : null;
    var min = ms !== null ? Math.round(ms / 60000) : null;
    idadeEl.textContent = min === null ? '—' : (min < 1 ? 'agora' : 'há ' + min + ' min');

    if (dados && dados.sucesso === false){
      dot.className = 'dot bad';
      banner.className = 'banner bad show';
      banner.textContent = 'O robô rodou mas a última leitura do ClickUp falhou (' + (dados.erro || 'erro não especificado') + '). Os números acima podem estar desatualizados.';
    } else if (min !== null && min > 25){
      dot.className = 'dot warn';
      banner.className = 'banner show';
      banner.textContent = 'Sem atualização há ' + min + ' minutos (esperado a cada 10). O robô pode ter parado — vale checar.';
    }

    document.getElementById('horaservidor').textContent = dados && dados.hora_brt ? ('última leitura: ' + dados.hora_brt + ' (Brasília)') : '';
  }

  function buscar(sess){
    return fetch(SB_URL, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + sess.access_token } });
  }

  function tick(){
    var sess = getSession();
    if (!sess){ showGate('Sua sessão expirou. Peça um novo link.', 'err'); return; }
    buscar(sess).then(function(r){
      if (r.status === 401){
        return renovarSessao(sess).then(function(novo){
          if (!novo) { showGate('Sua sessão expirou. Peça um novo link.', 'err'); return null; }
          return buscar(novo);
        });
      }
      return r;
    }).then(function(r){
      if (!r) return;
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(rows){
      if (!rows) return;
      var row = rows && rows[0];
      if (!row) { render(null, null, true); return; }
      try { localStorage.setItem('bb_painel_vivo_cache', JSON.stringify(row)); } catch(e) {}
      render(row.dados, row.atualizado_em, false);
    }).catch(function(){
      if (lastGood) render(lastGood.dados, lastGood.atualizado_em, true);
      else render(null, null, true);
    });
  }

  function iniciar(){
    showApp();
    tick();
    setInterval(tick, 20000);
  }

  document.getElementById('gateBtn').addEventListener('click', function(){
    var email = document.getElementById('gateEmail').value.trim();
    if (!email || email.indexOf('@') === -1){ showGate('Digite um e-mail válido.', 'err'); return; }
    pedirLink(email);
  });
  document.getElementById('gateEmail').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('gateBtn').click();
  });
  document.getElementById('signout').addEventListener('click', function(){
    clearSession();
    showGate('Você saiu. Digite seu e-mail para entrar de novo.', '');
  });

  if (tentarSessaoDaURL()){
    iniciar();
  } else {
    var sessaoExistente = getSession();
    if (sessaoExistente) iniciar();
    else showGate('', '');
  }
})();
</script>
